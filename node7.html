<!DOCTYPE html>
<html lang="pt">

<meta charset="UTF-8">
<title>NODE-7</title>

<body style="background:black;color:#00ff9d;font-family:monospace;text-align:center;padding-top:80px">

<h1>NODE-7</h1>

<p>
Entrada validada.
</p>

<p>
O sistema interpreta padrões como fluxo.
</p>

<pre>
F L O W
↓ ↓ ↓ ↓
estado de transmissão contínua
</pre>

<p>
NODE-7 pergunta:
</p>

<p>
o que mantém um sistema em FLOW?
</p>

<input id="input" placeholder="resposta..." />
<button onclick="check()">confirmar</button>

<script>
function check() {
  let v = document.getElementById("input").value.toLowerCase();

  if (
    v.includes("energia") ||
    v.includes("movimento") ||
    v.includes("transmissao") ||
    v.includes("continuidade")
  ) {
    window.location.href = "memory.html";
  } else {
    alert("NODE-7 rejeitou a interpretação");
  }
}
</script>
