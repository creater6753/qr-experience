<!DOCTYPE html>

<body style="background:black;color:#00ff9d;font-family:monospace;text-align:center;padding-top:80px">

<h1>NODE-7 CORE</h1>

<p>

</p>

<pre>
V L J Q D O
↑ ↑ ↑ ↑ ↑ ↑
transformação ativa
</pre>

<p>
O sistema pergunta:
</p>

<p>
o que acontece quando a informação é sempre deslocada?
</p>

<input id="input" placeholder="interpretação..." />
<button onclick="check()">confirmar</button>

<script>
function check() {
  let v = document.getElementById("input").value.toLowerCase();

  if (
    v.includes("erro") ||
    v.includes("ruido") ||
    v.includes("distorcao") ||
    v.includes("sinal")
  ) {
    window.location.href = "memory.html";
  } else {
    alert("interpretação rejeitada");
  }
}
</script>
