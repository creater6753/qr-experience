<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>NODE-7</title>
</head>

<body style="background:black;color:#00ff9d;font-family:monospace;text-align:center;padding-top:100px">

<h1>NODE-7</h1>

<p>
Entrada confirmada.
</p>

<p>
O sistema não regista palavras.
Regista sinais.
</p>

<p>
Memória fragmentada:
</p>

<p>
S _ G N A L
</p>

<p>
O sistema reconhece padrões incompletos.
</p>

<input id="input" placeholder="completa o sinal..." />
<button onclick="check()">confirmar</button>

<script>
function check() {
  let v = document.getElementById("input").value.toLowerCase().trim();

  if (v === "signal") {
    window.location.href = "memory.html";
  } else {
    alert("padrão rejeitado");
  }
}
</script>
