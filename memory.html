<!DOCTYPE html>

<title>MEMORY TRACE</title>

<body style="background:black;color:#00ff9d;font-family:monospace;text-align:center;padding-top:80px">

<h1>MEMÓRIA CORROMPIDA</h1>

<p>
Recuperação parcial concluída.
</p>

<p>
Registo oculto encontrado:
</p>

<pre>
S I G N A L
↓ ↓ ↓ ↓ ↓ ↓
o sistema comunica quando não deveria
</pre>

<p>
Interpretação final necessária.
</p>

<input id="input" placeholder="o que é SIGNAL?" />
<button onclick="check()">confirmar</button>

<script>
function check() {
  let v = document.getElementById("input").value.toLowerCase();

  if (
    v.includes("comunicacao") ||
    v.includes("informacao") ||
    v.includes("sistema") ||
    v.includes("dados")
  ) {
    window.location.href = "final.html";
  } else {
    alert("memória instável");
  }
}
</script>
