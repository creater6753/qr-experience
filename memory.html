<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>MEMÓRIA CORROMPIDA</title>
</head>

<body style="background:black;color:#00ff9d;font-family:monospace;text-align:center;padding-top:100px">

  <h1>MEMÓRIA CORROMPIDA</h1>

  <p>Tu já passaste por aqui.</p>
  <p>Mas o NODE-7 apagou parte do registo.</p>
  <p>Algo está incompleto.</p>

  <br>

  <input id="c" placeholder="o que falta?" />
  <button onclick="check()">confirmar</button>

  <script>
    function check() {
      let v = document.getElementById("c").value.toLowerCase().trim();

      if (v.includes("signal")) {
        window.location.href = "final.html";
      } else {
        alert("memória não reconhecida");
      }
    }
  </script>

</body>
</html>
